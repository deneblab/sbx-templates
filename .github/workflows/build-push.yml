name: Build and Push Docker Image

on:
  push:
    branches: [main]
  workflow_dispatch:

# Images are pushed to Docker Hub with DOCKER_TOKEN, not GITHUB_TOKEN, so this
# workflow never needs write access to the repository.
permissions:
  contents: read

jobs:
  build-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version
        id: version
        run: bash scripts/version/version.sh

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push sbx-claude-dotnet10
        uses: docker/build-push-action@v6
        with:
          context: src/sbx-claude-dotnet10
          push: true
          tags: |
            docker.io/pkudrel/sbx-claude-dotnet10:${{ steps.version.outputs.tag }}
            docker.io/pkudrel/sbx-claude-dotnet10:latest
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ steps.version.outputs.sha }}
            org.opencontainers.image.created=${{ steps.version.outputs.build_date_utc }}
            org.opencontainers.image.source=https://github.com/deneblab/sbx-templates
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            SHORT_SHA=${{ steps.version.outputs.short_sha }}
            BUILD_DATE=${{ steps.version.outputs.build_date_utc }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
