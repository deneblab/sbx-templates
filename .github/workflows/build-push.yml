name: Build and Push Docker Image

# DISABLED — manual only. Templates are distributed as Dockerfiles via the templates-v*
# release (release-templates.yml) and built locally by `sbxup`, so publishing prebuilt images
# to Docker Hub is no longer part of the normal flow. The push trigger is removed rather than
# the workflow deleted: re-adding `push: {branches: [main]}` restores the old behaviour, and
# "Run workflow" still publishes on demand.
on:
  workflow_dispatch:

# Images are pushed to Docker Hub with DOCKER_TOKEN, not GITHUB_TOKEN, so this
# workflow never needs write access to the repository.
permissions:
  contents: read

jobs:
  build-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Native binary: no .NET SDK step needed. See deneblab/abcversion README.
      - name: Install abcversion
        run: |
          curl -fsSL -o /usr/local/bin/abcversion \
            https://github.com/deneblab/abcversion/releases/latest/download/abcversion-linux-x64
          chmod +x /usr/local/bin/abcversion

      # Scoped to the dotnet10 project, matching what build-push.sh computes locally for the
      # same image — previously this step used the repo-wide count and the two disagreed.
      - name: Compute version
        id: version
        run: |
          VERSION=$(abcversion -p semversion --project dotnet10)
          {
            echo "version=$VERSION"
            echo "tag=v$VERSION"
            echo "sha=$(git rev-parse HEAD)"
            echo "short_sha=$(git rev-parse --short=7 HEAD)"
            echo "build_date_utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } >> "$GITHUB_OUTPUT"
          echo "Using version: $VERSION"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push sbx-claude-dotnet10
        uses: docker/build-push-action@v6
        with:
          context: src/sbx-claude-dotnet10
          push: true
          tags: |
            docker.io/pkudrel/sbx-claude-dotnet10:${{ steps.version.outputs.tag }}
            docker.io/pkudrel/sbx-claude-dotnet10:latest
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ steps.version.outputs.sha }}
            org.opencontainers.image.created=${{ steps.version.outputs.build_date_utc }}
            org.opencontainers.image.source=https://github.com/deneblab/sbx-templates
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            SHORT_SHA=${{ steps.version.outputs.short_sha }}
            BUILD_DATE=${{ steps.version.outputs.build_date_utc }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
