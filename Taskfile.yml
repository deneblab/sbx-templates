version: '3'

vars:
  DEFAULT_IMAGE: sbx-claude-dotnet10

tasks:
  default:
    silent: true
    cmds:
      - task --list

  # ── Tests ───────────────────────────────────────────────────────────────────

  test:
    desc: "Run all tests"
    cmds:
      - task: "test:version"

  "test:version":
    desc: "Run version script tests"
    cmds:
      - bash scripts/version/tests/version.sh.test.sh

  # ── Per-image shortcuts ────────────────────────────────────────────────────

  version:
    desc: "Show computed semver for default image ({{.DEFAULT_IMAGE}})"
    cmds:
      - task: "version:{{.DEFAULT_IMAGE}}"

  build:
    desc: "Build default image ({{.DEFAULT_IMAGE}}) locally"
    cmds:
      - task: "build:{{.DEFAULT_IMAGE}}"

  push:
    desc: "Build and push default image ({{.DEFAULT_IMAGE}})"
    cmds:
      - task: "push:{{.DEFAULT_IMAGE}}"

  # ── dotnet10 ───────────────────────────────────────────────────────────────

  "version:dotnet10":
    desc: "Show computed semver for sbx-claude-dotnet10"
    cmds:
      - task: "_version:{{OS}}"
        vars: { IMAGE: sbx-claude-dotnet10 }

  "build:dotnet10":
    desc: "Build sbx-claude-dotnet10 locally"
    cmds:
      - task: "_build:{{OS}}"
        vars: { IMAGE: sbx-claude-dotnet10 }

  "push:dotnet10":
    desc: "Build and push sbx-claude-dotnet10"
    cmds:
      - task: "_push:{{OS}}"
        vars: { IMAGE: sbx-claude-dotnet10 }

  # ── dotnet10-node ──────────────────────────────────────────────────────────

  "version:dotnet10-node":
    desc: "Show computed semver for sbx-claude-dotnet10-node"
    cmds:
      - task: "_version:{{OS}}"
        vars: { IMAGE: sbx-claude-dotnet10-node }

  "build:dotnet10-node":
    desc: "Build sbx-claude-dotnet10-node locally"
    cmds:
      - task: "_build:{{OS}}"
        vars: { IMAGE: sbx-claude-dotnet10-node }

  "push:dotnet10-node":
    desc: "Build and push sbx-claude-dotnet10-node"
    cmds:
      - task: "_push:{{OS}}"
        vars: { IMAGE: sbx-claude-dotnet10-node }

  # ── Unix (Linux + macOS) ─────────────────────────────────────────────────

  "_version:linux":
    internal: true
    cmds:
      - bash scripts/version/version.sh --path "src/{{.IMAGE}}"

  "_version:darwin":
    internal: true
    cmds:
      - bash scripts/version/version.sh --path "src/{{.IMAGE}}"

  "_build:linux":
    internal: true
    cmds:
      - bash scripts/build/build-push.sh --image "{{.IMAGE}}" --no-push

  "_build:darwin":
    internal: true
    cmds:
      - bash scripts/build/build-push.sh --image "{{.IMAGE}}" --no-push

  "_push:linux":
    internal: true
    cmds:
      - bash scripts/build/build-push.sh --image "{{.IMAGE}}"

  "_push:darwin":
    internal: true
    cmds:
      - bash scripts/build/build-push.sh --image "{{.IMAGE}}"

  # ── Windows (PowerShell) ─────────────────────────────────────────────────

  "_version:windows":
    internal: true
    cmds:
      - pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/version/version.ps1 -Path "src/{{.IMAGE}}"

  "_build:windows":
    internal: true
    cmds:
      - pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/build/build-push.ps1 -ImageName "{{.IMAGE}}" -NoPush

  "_push:windows":
    internal: true
    cmds:
      - pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/build/build-push.ps1 -ImageName "{{.IMAGE}}"
